
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>كاميرا تصوير الطالب</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f5f9;
      padding: 20px;
    }
    .box {
      max-width: 500px;
      margin: auto;
      padding: 18px;
      background: white;
      border-radius: 14px;
    }
    video, canvas, img {
      width: 100%;
      max-width: 420px;
      border-radius: 10px;
      background: #222;
    }
    button {
      padding: 12px 20px;
      margin: 8px;
      font-size: 17px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>تصوير الطالب</h2>
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" hidden></canvas>
    <img id="preview" hidden alt="معاينة الصورة">

    <p>
      <button id="start">تشغيل الكاميرا</button>
      <button id="capture" disabled>التقاط الصورة</button>
      <button id="send" disabled>إرسال الصورة</button>
    </p>
    <p id="status">اضغط تشغيل الكاميرا للبدء.</p>
  </div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const preview = document.getElementById("preview");
const statusText = document.getElementById("status");
let photo = "";

document.getElementById("start").onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" },
      audio: false
    });
    video.srcObject = stream;
    document.getElementById("capture").disabled = false;
    statusText.textContent = "الكاميرا تعمل.";
  } catch (e) {
    statusText.textContent = "تعذر تشغيل الكاميرا: " + e.name;
  }
};

document.getElementById("capture").onclick = () => {
  if (!video.videoWidth) {
    statusText.textContent = "انتظر ظهور صورة الكاميرا.";
    return;
  }
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video, 0, 0);
  photo = canvas.toDataURL("image/jpeg", 0.85);
  preview.src = photo;
  preview.hidden = false;
  document.getElementById("send").disabled = false;
  statusText.textContent = "تم التقاط الصورة.";
  video.srcObject.getTracks().forEach(track => track.stop());
};

document.getElementById("send").onclick = () => {
  if (!photo) return;
  if (!window.opener || window.opener.closed) {
    statusText.textContent =
      "يجب فتح الكاميرا من نافذة نموذج الطلاب أولاً.";
    return;
  }
  window.opener.postMessage(
    { type: "STUDENT_PHOTO_CAPTURED", photo },
    "https://script.google.com"
  );
  statusText.textContent = "تم إرسال الصورة إلى نافذة النموذج.";
};
</script>
</body>
</html>
